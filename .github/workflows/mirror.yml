# Mirror this canonical repo (slaish/seqNdisplayR) to the lab mirror
# (THJlab/seqNdisplayR). Triggered on every branch and every tag push so
# both repos stay in lock-step.
#
# Setup (one-time):
#   1. On github.com (as user `slaish`): create a fine-grained PAT with
#      Repository → Contents: Read & Write on THJlab/seqNdisplayR.
#   2. Settings → Secrets and variables → Actions → New repository secret:
#        Name:  MIRROR_TOKEN
#        Value: <the PAT>
#
# The push uses --all + --tags (branches + tags, additive). We deliberately
# do NOT use --mirror: actions/checkout only creates a local branch for the
# ref that triggered the workflow (typically main), so --mirror would try to
# delete every other branch on the target (including THJlab's `master`).
# Instead we pre-create local branches from all remote-tracking refs first,
# then push --all + --tags.

name: Mirror to THJlab

on:
  push:
    branches: ['**']
    tags: ['**']

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # all history + tags (needed for --mirror)
          persist-credentials: false # don't leave GITHUB_TOKEN in git config;
                                     # otherwise it clobbers MIRROR_TOKEN below
      - name: Push to THJlab mirror
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::MIRROR_TOKEN secret is not set on this repo." \
                 "Skip the mirror push; create the PAT and add it as a" \
                 "repo secret to enable the mirror."
            exit 1
          fi
          git remote add mirror \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/THJlab/seqNdisplayR.git"

          # Pre-create local branches from every remote-tracking ref so
          # `git push --all` sees them. Otherwise only the ref that
          # triggered this workflow (e.g. main) is a local branch.
          # Skip the currently checked-out branch (already a local branch,
          # and `git branch --force` refuses to update HEAD's ref).
          current=$(git symbolic-ref --short HEAD 2>/dev/null || echo "")
          for r in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/); do
            b="${r#origin/}"
            [ "$b" = "HEAD" ] && continue
            [ "$b" = "$current" ] && continue
            git branch --force "$b" "$r" >/dev/null
          done

          git push mirror --all
          git push mirror --tags

          # One-shot cleanup: earlier --mirror pushes leaked
          # refs/remotes/origin/{main,master} onto THJlab as literal refs.
          # These aren't real branches (not under refs/heads/) so users don't
          # see them, but they're clutter. Safe to run repeatedly.
          git push mirror \
            :refs/remotes/origin/main \
            :refs/remotes/origin/master \
            2>/dev/null || true
